  </g>
  <ellipse cx="32" cy="44" rx="9.5" ry="7.5" fill="#FFE2BF"/>
  <circle cx="25.5" cy="33" r="2.6" fill="#3B2418"/><circle cx="38.5" cy="33" r="2.6" fill="#3B2418"/>
  <circle cx="26.4" cy="32.1" r="0.9" fill="#fff"/><circle cx="39.4" cy="32.1" r="0.9" fill="#fff"/>
  <ellipse cx="32" cy="40.5" rx="3.6" ry="2.7" fill="#3B2418"/>
  <path d="M28.5 45.5q3.5 3 7 0" fill="none" stroke="#3B2418" stroke-width="1.6" stroke-linecap="round"/></g>
  <text x="186" y="128" fill="#3B2418" font-size="64" font-weight="800" letter-spacing="-2">Curl<tspan fill="#E07B24">Dog</tspan></text>
  <text fill="#3B2418" font-size="38" font-weight="700" letter-spacing="-0.5">
    <tspan x="64" y="232">Paste a curl.</tspan>
    <tspan x="64" y="280">CurlDog barks when it breaks.</tspan>
  </text>
  <text fill="#7A5A44" font-size="20">
    <tspan x="64" y="330">Uptime monitoring that runs on your own Cloudflare account.</tspan>
    <tspan x="64" y="360">No servers. No containers. Just a very loyal dog.</tspan>
  </text>

  <g transform="translate(720 56)" filter="url(#sh)">
    <rect width="496" height="128" rx="16" fill="#3B2418"/>
    <circle cx="24" cy="22" r="5" fill="#F87171"/><circle cx="42" cy="22" r="5" fill="#FBBF24"/><circle cx="60" cy="22" r="5" fill="#4ADE80"/>
    <text font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#FFE2BF">
      <tspan x="24" y="66"><tspan fill="#F2A65A">$</tspan> curl -s https://api.shop.dev/health \</tspan>
      <tspan x="40" y="96">-H "Authorization: Bearer $TOKEN"</tspan>
    </text>
  </g>

  <g transform="translate(720 208)" filter="url(#sh)">
    <rect width="496" height="92" rx="16" fill="#ffffff"/>
    <rect width="6" height="92" rx="3" fill="#EF4444"/>
    <text x="28" y="38" fill="#3B2418" font-size="19" font-weight="700">Woof! api.shop.dev is down</text>
    <text x="28" y="66" fill="#7A5A44" font-size="16">503 from 2 of 3 regions · DNS ok</text>
    <g transform="translate(356 30)"><rect width="116" height="32" rx="16" fill="#FFF4E6" stroke="#F2D3B0"/><text x="58" y="21" fill="#C25E12" font-size="14" font-weight="700" text-anchor="middle">Acknowledge</text></g>
  </g>

  <g transform="translate(720 320)" filter="url(#sh)">
    <rect width="496" height="64" rx="16" fill="#ffffff"/>
    <rect width="6" height="64" rx="3" fill="#22C55E"/>
    <text x="28" y="39" fill="#3B2418" font-size="18" font-weight="700">Good dog. Back up after 4m 12s</text>
  </g>
