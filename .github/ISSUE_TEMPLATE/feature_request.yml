name: Feature request
description: Suggest an idea for CurlDog.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Start with the pain, not the solution. "When X happens, I can't Y."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: checkboxes
    id: help
    attributes:
      label: Want to build it?
      options:
        - label: I'd like to open a pull request for this.
