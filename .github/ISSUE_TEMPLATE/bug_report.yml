name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **remove API keys, tokens and webhook URLs** from anything you paste.
        Found a security problem? Don't file it here. See [SECURITY.md](https://github.com/Compile7/moniwork/blob/master/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a monitor with `curl ...`
        2. Click Run now
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Checks / curl parsing
        - Alerts (Google Chat, Telegram, Slack, Discord)
        - Heartbeats
        - Diagnose view
        - Uptime Kuma import
        - Deploy / setup / Access
        - UI
        - Other
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v1.0.0 or 652ff02
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From `npx wrangler tail` or the Worker's Logs tab, if you have them.
      render: text
