<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CurlDog</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
    <div class="scrim" data-action="toggle-nav"></div>
    <div class="main-wrap">
      <header class="topbar">
        <button class="btn icon ghost" data-action="toggle-nav" aria-label="Open menu">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a href="/" class="brand"><span class="logo"></span>CurlDog</a>
      </header>
      <main id="main" class="main"></main>
    </div>
  </div>
  <dialog id="modal" class="modal"></dialog>
  <dialog id="confirm" class="modal small"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tip" class="tip" role="tooltip"></div>
</body>
</html>
